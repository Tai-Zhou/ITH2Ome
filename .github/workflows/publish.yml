name: Publish
permissions:
  contents: read

on:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install
      - run: pnpm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
