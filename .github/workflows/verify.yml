name: Verify
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: ^12.0.0
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm exec oxlint src/
      - name: Package VSIX
        run: pnpm run package
      # 凭据验证需要 secrets，PR（尤其 fork）拿不到，故只在 push / 手动触发时跑。
      # verify-pat 走的 Marketplace 接口偶发超时，故不阻断后续步骤。
      - name: Verify VS Code Marketplace credentials
        if: github.event_name != 'pull_request'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm run verify
