name: Verify
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package VSIX
        run: pnpm run package
      # 凭据验证需要 secrets，PR（尤其 fork）拿不到，故只在 push / 手动触发时跑。
      # verify-pat 走的 Marketplace 接口偶发超时，故不阻断后续步骤。
      - name: Verify VS Code Marketplace credentials
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce verify-pat
      - name: Verify Open VSX credentials
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx verify-pat
